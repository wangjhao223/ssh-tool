# remote-ws 项目约定（各连接入口每次读取，无需重新安装）
# MCP、Windows 双击入口和 WSL 脚本共用的唯一默认服务器设置
DEFAULT_SERVER=4090a
# 代码目录
CODE_ROOT=/home/wjh
# 数据、权重、训练结果、日志目录
DATA_ROOT=/data/wjh
# 服务器上自己的 Miniconda
CONDA_ROOT=/home/wjh/miniconda3
# 每台服务器可选的环境初始化方式：CONDA_INIT_<服务器名大写>=<初始化脚本>
# 缺省时 conda_env 用 CONDA_ROOT/bin/activate 激活（4090a 的用户 Miniconda 即此方式）
# a100 用系统预装 anaconda：source /opt/acd（等价于把该文件内容加进 ~/.bashrc）后 source activate <env>
CONDA_INIT_A100=/opt/acd
